[project]
name = "scm-staging"
version = "0.0.1"
description = "Library & tools for staging pull requests from gitea in the Open Build Service"
authors = [
    { name = "Dan Čermák", email = "dcermak@suse.com" }
]
license = {text="GPLv2.0-or-later"}
readme = "README.rst"
classifiers = []
dependencies = [
    #"python (>=3.11.0,<3.12.0)",
    "aiohttp (>=3.8.0,<3.9.0)",
    "py_obs >= 0.0.2",
    "py_gitea_opensuse_org @ git+https://github.com/dcermak/py-gitea-opensuse-org.git@main",
    "pika (>=1.3.2,<1.4.0)",
    "tornado (>=6.3.0,<6.4.0)",
    "pydantic (>=2.0.0,<3.0.0)",
]

[project.scripts]
submit_to_pool = "scm_staging.submit_to_pool:main"
app = "scm_staging.webhook:main"
ci_status = "scm_staging.ci_status:main"
cleanup_db = "scm_staging.cleanup:cleanup"

[tool.setuptools]
packages = [
    "scm_staging"
]

[project.optional-dependencies]
devel = [
    "black >=22.10",
    "mypy >=0.991",
    "pytest >=7.2",
    "httpx >=0.23",
    "pytest-asyncio >=0.20",
    "types-pika (>=1.2.0b1,<1.3.0)",
    "gitpython (>=3.1.31,<3.2.0)",
    "sphinx (>=7.0,<8.0)",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
